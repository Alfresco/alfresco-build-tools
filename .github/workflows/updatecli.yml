name: Updatecli

on:
  workflow_dispatch:
    inputs:
      kubernetes-version:
        description: Kubernetes minor version the KinD node image must move to, e.g. 1.35. Defaults to the minor of the current setup-kind node image.
        required: false
        type: string
  schedule:
    - cron: '0 6 * * 1'
  push:
    tags-ignore:
      - '**'
    paths:
      - '.updatecli/**'
      - .github/workflows/updatecli.yml

permissions:
    contents: write
    pull-requests: write

jobs:
  build-matrix-github-releases:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Matrix
        id: set-matrix
        run: |
          FILES_JSON=$(find .updatecli/values/github_releases -type f -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          echo "Files: $FILES_JSON"
          echo "matrix=$FILES_JSON" >> "$GITHUB_OUTPUT"

  update-github-releases:
    needs: build-matrix-github-releases
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        file: ${{ fromJson(needs.build-matrix-github-releases.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli
        uses: ./.github/actions/setup-updatecli

      - name: Run Updatecli
        run: updatecli pipeline apply -c .updatecli/templates/github_releases.yaml -v .updatecli/values/github_releases/${{ matrix.file }}
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATECLI_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
          UPDATECLI_EMAIL: ${{ vars.BOT_GITHUB_EMAIL }}
          UPDATECLI_REPO_OWNER: ${{ github.repository_owner }}
          UPDATECLI_REPO_NAME: ${{ github.event.repository.name }}
          UPDATECLI_REPO_BRANCH: ${{ github.event.repository.default_branch }}

  update-terraform-dependabot:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli
        uses: ./.github/actions/setup-updatecli

      - name: Run Updatecli
        run: updatecli pipeline apply -c .updatecli/manifests/terraform_dependabot.yaml
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATECLI_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
          UPDATECLI_EMAIL: ${{ vars.BOT_GITHUB_EMAIL }}
          UPDATECLI_REPO_OWNER: ${{ github.repository_owner }}
          UPDATECLI_REPO_NAME: ${{ github.event.repository.name }}
          UPDATECLI_REPO_BRANCH: ${{ github.event.repository.default_branch }}

  update-uv-dependabot:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli
        uses: ./.github/actions/setup-updatecli

      - name: Run Updatecli
        run: updatecli pipeline apply -c .updatecli/manifests/uv_dependabot.yaml
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATECLI_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
          UPDATECLI_EMAIL: ${{ vars.BOT_GITHUB_EMAIL }}
          UPDATECLI_REPO_OWNER: ${{ github.repository_owner }}
          UPDATECLI_REPO_NAME: ${{ github.event.repository.name }}
          UPDATECLI_REPO_BRANCH: ${{ github.event.repository.default_branch }}

  update-kind-node-image:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-slim
    concurrency:
      group: ${{ github.workflow }}-kind-node-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Kubernetes version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.kubernetes-version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(sed -nE 's/^[[:space:]]+default: kindest\/node:v([0-9]+\.[0-9]+)\..*/\1/p' .github/actions/setup-kind/action.yml)
          fi
          if [[ ! "$version" =~ ^1\.[0-9]+$ ]]; then
            echo "::error::Kubernetes version must be a minor version like 1.35, got '$version'"
            exit 1
          fi
          echo "kubernetes-version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Updatecli
        uses: ./.github/actions/setup-updatecli

      - name: Run Updatecli
        env:
          INPUT_VERSION: ${{ inputs.kubernetes-version }}
          KUBERNETES_VERSION: ${{ steps.version.outputs.kubernetes-version }}
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATECLI_REPO_OWNER: ${{ github.repository_owner }}
          UPDATECLI_REPO_NAME: ${{ github.event.repository.name }}
          UPDATECLI_REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          updatecli pipeline apply -c .updatecli/manifests/kind_node_image.yaml | tee updatecli.log
          # A failed condition only skips the pipeline and exits 0.
          if ! grep -qE 'Skipped:[[:space:]]+0' updatecli.log; then
            message="The latest KinD release has no node image for Kubernetes $KUBERNETES_VERSION"
            # Only a requested version is an error: KinD regularly drops old minors.
            if [ -n "$INPUT_VERSION" ]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::$message"
          fi
