name: CI with BATS 🦇

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned bats versions
        id: bats-versions
        shell: bash
        run: |
          tr -d "\"'" < .github/tests/bats-versions.yml \
            | sed -nE 's/^(bats_[a-z]+): *([^ #]+).*/\1=\2/p' >> "$GITHUB_OUTPUT"

      - name: Setup Bats and bats libs
        id: setup-bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # v4.1.0
        with:
          bats-version: ${{ steps.bats-versions.outputs.bats_core }}
          support-version: ${{ steps.bats-versions.outputs.bats_support }}
          assert-version: ${{ steps.bats-versions.outputs.bats_assert }}
          file-version: ${{ steps.bats-versions.outputs.bats_file }}

      - name: 🦇🦇🦇
        shell: bash
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
        run: bats -r --print-output-on-failure --formatter pretty .
