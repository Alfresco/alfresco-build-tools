name: Check dist

on:
  push:
    branches: [ master ]
    paths:
      - ".github/actions/dispatch-resume-workflow/**"
      - ".github/actions/release-notes-aggregator/**"
      - ".github/workflows/check-dist.yml"
  pull_request:
    branches: [ master ]
    paths:
      - ".github/actions/dispatch-resume-workflow/**"
      - ".github/actions/release-notes-aggregator/**"
      - ".github/workflows/check-dist.yml"

permissions:
  contents: read

jobs:
  check-dist:
    name: ${{ matrix.action }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in sync with runs.using in each action.yml
          - action: dispatch-resume-workflow
            node-version: 24
          - action: release-notes-aggregator
            node-version: 20
    defaults:
      run:
        working-directory: .github/actions/${{ matrix.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: .github/actions/${{ matrix.action }}/package-lock.json

      - run: rm -rf dist

      - run: npm ci

      - run: npm run build

      - name: Compare dist
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result, or download the 'dist-${{ matrix.action }}' artifact."
            git status --porcelain -- dist
            git diff --ignore-space-at-eol --stat -- dist
            exit 1
          fi

      - if: failure() && steps.diff.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.action }}
          path: .github/actions/${{ matrix.action }}/dist/
