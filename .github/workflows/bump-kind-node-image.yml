name: Bump KinD node image

on:
  workflow_dispatch:
    inputs:
      kubernetes-version:
        description: Kubernetes minor version the KinD node image must follow, e.g. 1.35
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    # Only the default branch's reviewed manifest may run with the write-scoped app token.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-slim
    steps:
      - name: Validate Kubernetes version
        env:
          KUBERNETES_VERSION: ${{ inputs.kubernetes-version }}
        run: |
          if [[ ! "$KUBERNETES_VERSION" =~ ^1\.[0-9]+$ ]]; then
            echo "::error::kubernetes-version must be a minor version like 1.35, got '$KUBERNETES_VERSION'"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PRs opened with GITHUB_TOKEN don't trigger CI, and the bump must be tested by test-kind.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Install Updatecli
        uses: ./.github/actions/setup-updatecli

      - name: Run Updatecli
        env:
          KUBERNETES_VERSION: ${{ inputs.kubernetes-version }}
          UPDATECLI_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATECLI_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
          UPDATECLI_EMAIL: ${{ vars.BOT_GITHUB_EMAIL }}
          UPDATECLI_REPO_OWNER: ${{ github.repository_owner }}
          UPDATECLI_REPO_NAME: ${{ github.event.repository.name }}
          UPDATECLI_REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          updatecli pipeline apply -c .updatecli/manifests/kind_node_image.yaml | tee updatecli.log
          # A failed condition only skips the pipeline and exits 0.
          if ! grep -qE 'Skipped:[[:space:]]+0' updatecli.log; then
            echo "::error::The latest KinD release has no node image for Kubernetes $KUBERNETES_VERSION"
            exit 1
          fi
