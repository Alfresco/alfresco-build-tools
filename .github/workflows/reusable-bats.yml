name: Reusable Bats tests

on:
  workflow_call:
    inputs:
      path:
        description: "File or directory passed to bats, relative to the repository root"
        required: false
        type: string
        default: "."
      bats-args:
        description: "Arguments passed to bats before the path"
        required: false
        type: string
        default: "-r --print-output-on-failure --formatter pretty"
      bats-version:
        description: "bats-core version, defaults to the one pinned in alfresco-build-tools"
        required: false
        type: string
      support-version:
        description: "bats-support version, defaults to the one pinned in alfresco-build-tools"
        required: false
        type: string
      assert-version:
        description: "bats-assert version, defaults to the one pinned in alfresco-build-tools"
        required: false
        type: string
      file-version:
        description: "bats-file version, defaults to the one pinned in alfresco-build-tools"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bats and bats libs
        id: setup-bats
        uses: $/.github/actions/setup-bats
        with:
          bats-version: ${{ inputs.bats-version }}
          support-version: ${{ inputs.support-version }}
          assert-version: ${{ inputs.assert-version }}
          file-version: ${{ inputs.file-version }}

      - name: 🦇🦇🦇
        shell: bash
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          BATS_ARGS: ${{ inputs.bats-args }}
          BATS_PATH: ${{ inputs.path }}
          TERM: xterm
        run: |
          read -ra args <<< "$BATS_ARGS"
          bats "${args[@]}" "$BATS_PATH"
