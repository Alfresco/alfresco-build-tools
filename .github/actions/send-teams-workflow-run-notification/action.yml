name: Send Teams workflow run notification
description: Sends a Teams card describing the workflow run that triggered a workflow_run event, rather than the run sending it.
inputs:
  webhook-url:
    description: Microsoft Teams Incoming Webhooks URL
    required: true
  reason-code:
    description: The 'reason-code' output of workflow-run-auto-retry, one of 'attempts-exhausted', 'non-retryable' or 'nothing-to-retry'. Generates the first sentence of the message. Required unless message is set
    required: false
    default: ""
  failed-jobs:
    description: Display names of the jobs that failed, one per line, such as the 'failed-jobs' output of workflow-run-auto-retry
    required: false
    default: ""
  title:
    description: Card title, shown next to the red status dot
    required: false
    default: Workflow run failed
  subtitle:
    description: One line shown under the title
    required: false
    default: ""
  message:
    description: Message text, appended to the sentence generated from reason-code. Required unless reason-code is set
    required: false
    default: ""
  facts:
    description: 'Newline separated list of extra rows in format "title|value", shown after the run details (e.g.: "Release version|26.2.0")'
    required: false
    default: ""
  footer:
    description: Closing line, e.g. naming who should pick this up. Include the <at>name</at> markup of anything listed in mention-users or mention-tags
    required: false
    default: ""
  mention-users:
    description: 'Comma or newline separated list of users to mention in format "display name|email"'
    required: false
    default: ''
  mention-tags:
    description: 'Comma or newline separated list of Teams tags to mention in format "tag name|tag id"'
    required: false
    default: ''
  max-attempts:
    description: The 'max-attempts' output of workflow-run-auto-retry, used to word the attempt count
    required: false
    default: ""
  dry-run:
    description: Build the card and print it without sending
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - id: card
      shell: bash
      env:
        REASON_CODE: ${{ inputs.reason-code }}
        ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        FAILED_JOBS: ${{ inputs.failed-jobs }}
        TITLE: ${{ inputs.title }}
        SUBTITLE: ${{ inputs.subtitle }}
        MESSAGE: ${{ inputs.message }}
        FACTS: ${{ inputs.facts }}
        FOOTER: ${{ inputs.footer }}
        REPOSITORY: ${{ github.repository }}
        BRANCH: ${{ github.event.workflow_run.head_branch }}
        WORKFLOW: ${{ github.event.workflow_run.name }}
      run: ${{ github.action_path }}/build-card.sh

    - uses: $/.github/actions/send-teams-card
      with:
        webhook-url: ${{ inputs.webhook-url }}
        card-body: ${{ steps.card.outputs.body }}
        mention-users: ${{ inputs.mention-users }}
        mention-tags: ${{ inputs.mention-tags }}
        # Nothing failed in the watcher itself, so the colour has to be stated.
        status: failure
        dry-run: ${{ inputs.dry-run }}
        card-actions: >-
          [{"type":"Action.OpenUrl","title":"View failed run","url":"${{ github.event.workflow_run.html_url }}"}]
