name: Dependency chain changes
description: Lists the changes between two refs and, where a pinned upstream version moved, repeats that across the repositories it came from.
inputs:
  repository:
    description: Repository to start from, as owner/name.
    required: false
    default: ${{ github.repository }}
  from-ref:
    description: The last known good ref. Anything git resolves - a tag, a branch or a sha.
    required: true
  to-ref:
    description: The ref being investigated, usually the one that failed.
    required: true
  upstream:
    description: |
      Dependency edges, one per line, as
      `consumer-repo | upstream-repo | version-file | regex | ref-template`.
      The regex needs one capture group holding the version, and the template turns that
      version into a ref in the upstream repo. Empty means do not follow anything.
    required: false
    default: ""
  mention-domain:
    description: Email domain whose addresses are worth mentioning. Empty puts everyone in `plain`.
    required: false
    default: ""
  max-depth:
    description: How many repositories deep to follow the chain, counting the first one.
    required: false
    default: "3"
  github-token:
    description: Token used to read commits, file contents and pull requests. Needs contents read on every repository in the chain.
    required: false
    default: ${{ github.token }}
outputs:
  people:
    description: Comma-separated GitHub logins of the humans involved, including whoever merged a bot's pull request
    value: ${{ steps.collect.outputs.people }}
  bots:
    description: Comma-separated logins of the bots whose pull requests are in range
    value: ${{ steps.collect.outputs.bots }}
  mentionable:
    description: "`Display Name|email` pairs for the people whose address matches mention-domain"
    value: ${{ steps.collect.outputs.mentionable }}
  plain:
    description: "`@login` for everyone who is not in `mentionable`"
    value: ${{ steps.collect.outputs.plain }}
  cc:
    description: mentionable and plain joined into one list, ready for the cc input of send-teams-workflow-run-notification
    value: ${{ steps.collect.outputs.cc }}
  changes:
    description: Every change found, as a JSON array with repo, sha, login, name, email, kind, pr, title and url
    value: ${{ steps.collect.outputs.changes }}
  count:
    description: How many changes were found
    value: ${{ steps.collect.outputs.count }}
  truncated:
    description: "'true' when a limit was reached, so the list is incomplete"
    value: ${{ steps.collect.outputs.truncated }}
runs:
  using: composite
  steps:
    - id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repository }}
        FROM_REF: ${{ inputs.from-ref }}
        TO_REF: ${{ inputs.to-ref }}
        UPSTREAM: ${{ inputs.upstream }}
        MENTION_DOMAIN: ${{ inputs.mention-domain }}
        MAX_DEPTH: ${{ inputs.max-depth }}
      run: ${{ github.action_path }}/dependency-chain-changes.sh
