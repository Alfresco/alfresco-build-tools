name: Deploy artifacts to S3 Bucket
description: Deploys a local directory of artifacts to a S3 bucket.

inputs:
  aws-region:
    description: AWS region
    required: true
  aws-role-arn:
    description: AWS role ARN to assume for deployment
    required: true
  deploy-dir:
    description: Local directory containing artifacts to upload
    required: false
    default: ./deploy_dir
  s3-bucket:
    description: S3 bucket name
    required: true
  s3-path:
    description: Path within the S3 bucket (without leading slash).
    required: true
  role-duration-seconds:
    description: Duration in seconds for the assumed AWS role session.
    required: false
    default: "3600"

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-role-arn }}
        role-session-name: ${{ github.event.repository.name }}-s3-upload-${{ github.run_id }}
        role-duration-seconds: ${{ inputs.role-duration-seconds }}

    - name: Upload to S3 bucket
      shell: bash
      env:
        DEPLOY_DIR: ${{ inputs.deploy-dir }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_PATH: ${{ inputs.s3-path }}
      run: |
        if [ -n "${S3_PATH}" ]; then
          s3_destination="s3://${S3_BUCKET}/${S3_PATH}"
        else
          s3_destination="s3://${S3_BUCKET}"
        fi
        aws s3 cp --acl private --recursive "${DEPLOY_DIR}" "${s3_destination}"
