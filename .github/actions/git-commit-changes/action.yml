name: "Commit changes"
description: "Commit current changes"
inputs:
  username:
    description: "The username to be set as global user"
    required: true
  add-options:
    description: "Options to be added to `git add`"
    required: true
  commit-message:
    description: "The commit message to be used while committing"
    required: true
  repository-directory:
    description: "Path to the the directory holding the git repository"
    required: false
  commit-options:
    description: "Additional Git commit command options"
    required: false
    default: ''
  skip-if-no-changes:
    description: "Skips the actual commit when no changes are staged"
    required: false
    default: 'false'
  gpg-private-key:
    description: "ASCII-armored GPG private key for commit signing"
    required: false
    default: ''
  gpg-private-key-fingerprint:
    description: "40-char GPG fingerprint of the signing key; required when gpg-private-key is provided"
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Commit staged changes
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
        GPG_PRIVATE_KEY_FINGERPRINT: ${{ inputs.gpg-private-key-fingerprint }}
      run: |
        REPO_DIR="${{inputs.repository-directory}}"
        if [ -n "$REPO_DIR" ]
        then
          cd $REPO_DIR
        fi
        git config --global user.name ${{ inputs.username }}
        git config --global user.email ${{ inputs.username }}@users.noreply.github.com
        # shellcheck source=../setup-gpg-commit-signing/setup-gpg-commit-signing.sh
        source "${GITHUB_ACTION_PATH}/../setup-gpg-commit-signing/setup-gpg-commit-signing.sh"
        git add ${{ inputs.add-options }}
        git status
        git --no-pager diff --cached
        if ${{ inputs.skip-if-no-changes == 'true' }} ;
        then
          git diff-index --quiet HEAD || git commit -m "${{ inputs.commit-message }}" ${{ inputs.commit-options }}
        else
          git commit -m "${{ inputs.commit-message }}" ${{ inputs.commit-options }}
        fi
