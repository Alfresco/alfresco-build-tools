name: "Commit changes"
description: "Commit current changes"
inputs:
  username:
    description: "The username to be set as global user"
    required: true
  email:
    description: "Git author email; defaults to {username}@users.noreply.github.com when omitted"
    required: false
    default: ''
  add-options:
    description: "Options to be added to `git add`"
    required: true
  commit-message:
    description: "The commit message to be used while committing"
    required: true
  repository-directory:
    description: "Path to the the directory holding the git repository"
    required: false
  commit-options:
    description: "Additional Git commit command options"
    required: false
    default: ''
  skip-if-no-changes:
    description: "Skips the actual commit when no changes are staged"
    required: false
    default: 'false'
  gpg-private-key:
    description: "ASCII-armored GPG private key for commit signing"
    required: false
    default: ''
  gpg-private-key-fingerprint:
    description: "40-char GPG fingerprint of the signing key; required when gpg-private-key is provided"
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Commit staged changes
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
        GPG_PRIVATE_KEY_FINGERPRINT: ${{ inputs.gpg-private-key-fingerprint }}
        GIT_COMMIT_USERNAME: ${{ inputs.username }}
        GIT_COMMIT_EMAIL: ${{ inputs.email }}
        GIT_COMMIT_ADD_OPTIONS: ${{ inputs.add-options }}
        GIT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        GIT_COMMIT_OPTIONS: ${{ inputs.commit-options }}
        GIT_COMMIT_REPO_DIR: ${{ inputs.repository-directory }}
        GIT_COMMIT_SKIP_IF_NO_CHANGES: ${{ inputs.skip-if-no-changes }}
      run: |
        if [ -n "$GIT_COMMIT_REPO_DIR" ]; then
          cd "$GIT_COMMIT_REPO_DIR"
        fi
        git config --global user.name "$GIT_COMMIT_USERNAME"
        git config --global user.email "${GIT_COMMIT_EMAIL:-${GIT_COMMIT_USERNAME}@users.noreply.github.com}"
        # shellcheck source=../setup-gpg-commit-signing/setup-gpg-commit-signing.sh
        source "${GITHUB_ACTION_PATH}/../setup-gpg-commit-signing/setup-gpg-commit-signing.sh"
        # shellcheck disable=SC2086
        git add $GIT_COMMIT_ADD_OPTIONS
        git status
        git --no-pager diff --cached
        GIT_COMMIT_MESSAGE="$(printf '%s' "$GIT_COMMIT_MESSAGE" | envsubst)"
        if [ "$GIT_COMMIT_SKIP_IF_NO_CHANGES" = "true" ]; then
          # shellcheck disable=SC2086
          git diff-index --quiet HEAD || git commit -m "$GIT_COMMIT_MESSAGE" $GIT_COMMIT_OPTIONS
        else
          # shellcheck disable=SC2086
          git commit -m "$GIT_COMMIT_MESSAGE" $GIT_COMMIT_OPTIONS
        fi
