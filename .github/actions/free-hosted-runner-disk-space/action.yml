name: Free GHA runner disk space
description: Frees up disk space on GitHub Actions hosted runners by removing unneeded software.
inputs:
  remove-dotnet:
    description: Removes .NET runtime and libraries
    required: false
    default: 'true'
  remove-haskell:
    description: Removes GHC (Haskell) artifacts
    required: false
    default: 'true'
  remove-tools-cache:
    description: Removes tools and dependencies cached
    required: false
    default: 'false'
  remove-android:
    description: Removes Android SDKs and Tools
    required: false
    default: 'true'
  remove-codeql:
    description: Removes CodeQL Action Bundles
    required: false
    default: 'true'
  remove-swift:
    description: Removes Swift toolchain and libraries
    required: false
    default: 'true'
  remove-powershell:
    description: Removes PowerShell Core installation
    required: false
    default: 'true'
  remove-docker-images:
    description: Removes cached Docker images
    required: false
    default: 'false'
  remove-paths:
    description: Additional collection of files/folders to be removed, separated by spaces
    default: ''
    required: false
  async:
    description: Deletes in the background without waiting for the removal to complete, so freed space becomes available gradually
    required: false
    default: 'true'
  diagnose-top-offenders-enabled:
    description: Runs diagnostic steps to list top disk space offenders before cleanup (and after it when async is false), and reports the size of each folder before it is removed
    required: false
    default: 'false'

outputs:
  removal-pids:
    description: Space-separated PIDs of the background removal processes still running when the step ends (empty when async is false). Wait until none is alive for the freed space to be fully available
    value: ${{ steps.remove.outputs.removal-pids }}

runs:
  using: composite
  steps:
    - name: Runner system report before modification
      shell: bash
      run: |
        echo "Memory and swap:"
        free -m
        echo

        echo "Available storage:"
        df -h
        echo

    - name: Run optional diagnostic of top offenders before cleanup
      if: inputs.diagnose-top-offenders-enabled == 'true'
      run: |
        sudo du -h --max-depth=4 /usr /opt 2>/dev/null | sort -hr | head -n 20 || true
      shell: bash

    - name: Remove unwanted software
      id: remove
      env:
        DOTNET_ROOT: /usr/share/dotnet
        ANDROID_ROOT: /usr/local/lib/android
        HASKELL_ROOT: /usr/local/.ghcup
        CODEQL_ROOT: /opt/hostedtoolcache/CodeQL
        SWIFT_ROOT: /usr/share/swift
        POWERSHELL_ROOT: /usr/local/share/powershell
      run: |
        diagnose="${{ inputs.diagnose-top-offenders-enabled }}"
        async="${{ inputs.async }}"
        overall_start=$(date +%s)
        pids=()
        trash_dirs=()

        # Low priority, so the removal doesn't compete with the job for disk I/O
        run_detached() {
          nohup setsid sudo ionice -c2 -n7 nice -n 10 "$@" >/dev/null 2>&1 &
          pids+=("$!")
        }

        # Renaming is instant on the same filesystem, so later steps never see a half-deleted path
        remove_path() {
          local path="$1" keep_dir="${2:-}" trash
          trash=$(sudo mktemp -d -p "$(dirname "$path")" .trash.XXXXXX)
          if [[ "$keep_dir" == '--keep-dir' ]]; then
            sudo find "$path" -mindepth 1 -maxdepth 1 -exec mv -t "$trash" {} +
          else
            sudo mv "$path" "$trash/"
          fi
          trash_dirs+=("$trash")
        }

        remove_in_background() {
          local label="$1" path="$2" keep_dir="${3:-}"
          if [[ -d "$path" ]]; then
            echo "Removing $label ($path) in the background..."
            [[ "$diagnose" == 'true' ]] && du -sh "$path" 2>/dev/null || true
            remove_path "$path" "$keep_dir"
          else
            echo "$path not found, skipping $label"
          fi
        }

        [[ ${{ inputs.remove-dotnet }} == 'true' ]] && remove_in_background ".NET runtime and libraries" "$DOTNET_ROOT"
        [[ ${{ inputs.remove-android }} == 'true' ]] && remove_in_background "Android SDKs and Tools" "$ANDROID_ROOT"
        [[ ${{ inputs.remove-haskell }} == 'true' ]] && remove_in_background "GHC (Haskell) artifacts" "$HASKELL_ROOT"
        [[ ${{ inputs.remove-codeql }} == 'true' ]] && remove_in_background "CodeQL Action Bundles" "$CODEQL_ROOT"
        [[ ${{ inputs.remove-swift }} == 'true' ]] && remove_in_background "Swift toolchain and libraries" "$SWIFT_ROOT"
        [[ ${{ inputs.remove-powershell }} == 'true' ]] && remove_in_background "PowerShell Core installation" "$POWERSHELL_ROOT"
        # Some actions assume the folder always exists on the hosted runner
        [[ ${{ inputs.remove-tools-cache }} == 'true' ]] && remove_in_background "tools and dependencies cache" "$AGENT_TOOLSDIRECTORY" --keep-dir

        if [[ ${{ inputs.remove-docker-images }} == 'true' ]]; then
          echo "Removing cached Docker images in the background..."
          run_detached docker image prune --all --force
        fi

        to_remove="${{ inputs.remove-paths }}"
        if [[ -n "$to_remove" ]]; then
          for item in $to_remove; do
            [[ -e "$item" || -L "$item" ]] || { echo "$item not found, skipping"; continue; }
            echo "Removing $item in the background..."
            [[ "$diagnose" == 'true' ]] && du -sh "$item" 2>/dev/null || true
            remove_path "$item"
          done
        fi

        if [[ "${#trash_dirs[@]}" -gt 0 ]]; then
          run_detached rm -rf "${trash_dirs[@]}"
        fi

        failed=0
        if [[ "$async" == 'true' ]]; then
          echo "removal-pids=${pids[*]}" >> "$GITHUB_OUTPUT"
        else
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
        fi

        overall_end=$(date +%s)
        echo "Removal step finished in $((overall_end - overall_start)) seconds."

        if [[ "$failed" -eq 1 ]]; then
          echo "One or more removal commands failed." >&2
          exit 1
        fi
      shell: bash

    - name: Run optional diagnostic of top offenders after cleanup
      # In async mode the removal is still running, so the sizes would not be meaningful
      if: inputs.diagnose-top-offenders-enabled == 'true' && inputs.async != 'true'
      run: |
        sudo du -h --max-depth=4 /usr /opt 2>/dev/null | sort -hr | head -n 20 || true
      shell: bash

    - name: Runner system report after cleanup
      run: |
        echo "Memory and swap:"
        free -m
        echo

        echo "Available storage:"
        df -h
      shell: bash
