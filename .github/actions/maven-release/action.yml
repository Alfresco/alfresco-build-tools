name: Release Maven project
description: Release Maven project

inputs:
  repo:
    description: "Repository to be released"
    required: true
  base-ref:
    description: "The name of the base ref from where the release will be created. Typically a pre-release tag."
    required: true
  extra-replacements:
    description: Extra properties to replace
    required: false
  release-version:
    description: "The name of the version to be released"
    required: true
  staging-repository:
    description: "The id of the staging repository where the release artifacts will be stored"
    required: true
  cloudsmith-namespace:
    description: "Opt in to also deploy to the same staging repository in this Cloudsmith namespace. Requires id-token: write, a cloudsmith Maven server and Maven Deploy Plugin 3.x."
    required: false
    default: ""
  maven-deploy-plugin-major-version:
    description: "Major version of the project's Maven Deploy Plugin, used to select the alternative repository syntax."
    required: false
    default: "2"
  github-token:
    description: "The token used to clone the repository"
    required: true
  git-username:
    description: "The username for git commit"
    required: true
  gpg-passphrase:
    description: "GPG passphrase"
    required: true
  gpg-secret-keys:
    description: "GPG secrets key"
    required: true
  gpg-owner-trust:
    description: "GPG Owner trust"
    required: true
  nexus-username:
    description: "Nexus user name"
    required: true
  nexus-password:
    description: "Nexus password"
    required: true
  nexus-url:
    description: "Base URL to the Nexus server"
    required: false
    default: "https://artifacts.alfresco.com/nexus"
  maven-settings-path:
    description: "Path to the settings.xml file to be used for the release"
    required: false
    default: ${{ github.workspace }}/maven-config/settings.xml
  java-version:
    description: the desired Java version
    required: false
    default: "11"
  java-distribution:
    description: the desired Java distribution
    required: false
    default: "temurin"
  maven-version:
    description: "Optional Maven version to install. Empty preserves the runner's Maven."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set global properties
      shell: bash
      env:
        REPO_DIR: ${{ github.workspace }}/${{ inputs.repo }}
        RELEASE_VERSION: ${{ inputs.release-version }}
      run: |
        echo "REPO_DIR=$REPO_DIR" >> $GITHUB_ENV
        echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

    - name: Checkout ${{ inputs.repo }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: '${{ inputs.repo }}'
        ref: ${{ inputs.base-ref }}
        path: '${{ env.REPO_DIR }}'
        token: ${{ inputs.github-token }}

    - uses: $/.github/actions/git-check-existing-tag
      id: check-tag
      with:
        tag: ${{ env.RELEASE_VERSION }}
        repository-directory: ${{ env.REPO_DIR }}

    - name: Set up JDK
      if: steps.check-tag.outputs.exists == 'false'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        cache: 'maven'

    - name: Set up Maven
      if: steps.check-tag.outputs.exists == 'false' && inputs.maven-version != ''
      uses: $/.github/actions/setup-maven
      with:
        version: ${{ inputs.maven-version }}

    - name: Configure Maven settings
      if: steps.check-tag.outputs.exists == 'false'
      shell: bash
      env:
        MAVEN_SETTINGS_PATH: ${{inputs.maven-settings-path}}
      run: |
        M2_DIR=$HOME/.m2
        cp $MAVEN_SETTINGS_PATH $M2_DIR
        cat $M2_DIR/settings.xml

    - name: Configure GPG
      if: steps.check-tag.outputs.exists == 'false'
      shell: bash
      env:
        GPG_SECRET_KEYS: "${{ inputs.gpg-secret-keys }}"
        GPG_OWNERTRUST: "${{ inputs.gpg-owner-trust }}"
      run: |
        gpg --version
        echo $GPG_SECRET_KEYS | base64 --decode | gpg --import --no-tty --batch --yes
        echo $GPG_OWNERTRUST | gpg --import-ownertrust  --no-tty --batch --yes

    - name: update-pom-to-release-version
      if: steps.check-tag.outputs.exists == 'false'
      working-directory: ${{ env.REPO_DIR }}
      shell: bash
      env:
        EXTRA_REPLACEMENTS: ${{ inputs.extra-replacements }}
      run: |
        ${{ github.action_path }}/update-pom-version.sh "$RELEASE_VERSION" "$EXTRA_REPLACEMENTS"

    - name: Deploy release to Nexus staging
      if: steps.check-tag.outputs.exists == 'false'
      working-directory: ${{ env.REPO_DIR }}
      shell: bash
      env:
        GPG_PASSPHRASE: "${{ inputs.gpg-passphrase }}"
        GPG_SECRET_KEYS: "${{ inputs.gpg-secret-keys }}"
        GPG_OWNERTRUST: "${{ inputs.gpg-owner-trust }}"
        NEXUS_USERNAME: "${{ inputs.nexus-username }}"
        NEXUS_PASSWORD: "${{ inputs.nexus-password }}"
        NEXUS_URL: "${{ inputs.nexus-url }}"
        STAGING_REPOSITORY_ID: ${{ inputs.staging-repository }}
        JAVA_VERSION: "${{ inputs.java-version }}"
        CLOUDSMITH_NAMESPACE: ${{ inputs.cloudsmith-namespace }}
        MAVEN_DEPLOY_PLUGIN_MAJOR_VERSION: ${{ inputs.maven-deploy-plugin-major-version }}
      run: bash "${{ github.action_path }}/deploy.sh" nexus

    - name: Authenticate with Cloudsmith
      if: steps.check-tag.outputs.exists == 'false' && inputs.cloudsmith-namespace != ''
      uses: $/.github/actions/cloudsmith-auth
      with:
        oidc-namespace: ${{ inputs.cloudsmith-namespace }}

    - name: Deploy release to Cloudsmith staging
      if: steps.check-tag.outputs.exists == 'false' && inputs.cloudsmith-namespace != ''
      working-directory: ${{ env.REPO_DIR }}
      shell: bash
      env:
        GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
        NEXUS_USERNAME: ${{ inputs.nexus-username }}
        NEXUS_PASSWORD: ${{ inputs.nexus-password }}
        NEXUS_URL: ${{ inputs.nexus-url }}
        STAGING_REPOSITORY_ID: ${{ inputs.staging-repository }}
        JAVA_VERSION: ${{ inputs.java-version }}
        CLOUDSMITH_NAMESPACE: ${{ inputs.cloudsmith-namespace }}
        MAVEN_DEPLOY_PLUGIN_MAJOR_VERSION: ${{ inputs.maven-deploy-plugin-major-version }}
      run: bash "${{ github.action_path }}/deploy.sh" cloudsmith

    - name: Commit changes
      if: steps.check-tag.outputs.exists == 'false'
      uses: $/.github/actions/git-commit-changes
      with:
        username: ${{ inputs.git-username }}
        add-options: -u
        commit-message: "Release version ${{ inputs.release-version}}"
        repository-directory: ${{ env.REPO_DIR }}

    - name: Create and push tag
      if: steps.check-tag.outputs.exists == 'false'
      working-directory: ${{ env.REPO_DIR }}
      shell: bash
      run: |
        git tag -f -a "${RELEASE_VERSION}" -m "Release version ${RELEASE_VERSION}"
        git push origin "${RELEASE_VERSION}"
