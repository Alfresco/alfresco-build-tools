name: "Setup Java build"
description: "Performs the setup of required build tools (eg.: Maven, Java)"
inputs:
  java-version:
    description: the desired Java version
    default: "17"
    required: false
  java-distribution:
    description: the desired Java distribution
    default: "temurin"
    required: false
  maven-settings:
    description: the location of the custom Maven settings.xml file to install
    default: ".ci.settings.xml"
    required: false
  skip-default-settings:
    description: no longer used, a settings file is only installed when the repository provides one
    deprecationMessage: skip-default-settings no longer has any effect and will be removed in a future major release
    default: "false"
    required: false
  cache-key-prefix:
    description: the prefix for the maven repository cache key (eg. to handle multiple maven caches within the same repository)
    default: "maven"
    required: false
runs:
  using: composite
  steps:
    - name: "Cache local Maven repository"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-${{ inputs.cache-key-prefix }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-key-prefix }}-
    - name: "Install ${{ inputs.maven-settings }}"
      shell: bash
      env:
        MAVEN_SETTINGS: ${{ inputs.maven-settings }}
      run: ${{ github.action_path }}/install-settings.sh
    - name: "Set up Java"
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        overwrite-settings: false
