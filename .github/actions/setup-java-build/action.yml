name: "Setup Java build"
description: "Performs the setup of required build tools (eg.: Maven, Java)"
inputs:
  java-version:
    description: the desired Java version
    default: "17"
    required: false
  java-distribution:
    description: the desired Java distribution
    default: "temurin"
    required: false
  maven-settings:
    description: the location of the custom Maven settings.xml file to install
    default: ".ci.settings.xml"
    required: false
  skip-default-settings:
    description: no longer used, a settings file is only installed when the repository provides one
    deprecationMessage: skip-default-settings no longer has any effect and will be removed in a future major release
    default: "false"
    required: false
  cache-key-prefix:
    description: the prefix for the maven repository cache key (eg. to handle multiple maven caches within the same repository)
    default: "maven"
    required: false
  cache-mode:
    description: >
      "restore-save" restores the Maven repository and saves it at the end of the job, "restore" only restores it,
      "none" skips the cache. Jobs using "restore" never save, so one job in the workflow (the full build) must use
      "restore-save"
    default: "restore-save"
    required: false
outputs:
  cache-hit:
    description: '"true" when an entry with the exact cache key was restored'
    value: ${{ steps.cache.outputs.cache-hit || steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: the cache key for the current pom.xml files
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - name: "Compute the Maven cache key"
      id: key
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.cache-mode }}
        KEY_PREFIX: ${{ runner.os }}-${{ inputs.cache-key-prefix }}-
        POM_HASH: ${{ hashFiles('**/pom.xml') }}
      run: |
        case "${CACHE_MODE}" in
          restore-save|restore|none) ;;
          *) echo "::error::cache-mode must be restore-save, restore or none, got '${CACHE_MODE}'"; exit 1 ;;
        esac
        echo "prefix=${KEY_PREFIX}" >> "$GITHUB_OUTPUT"
        echo "key=${KEY_PREFIX}${POM_HASH}" >> "$GITHUB_OUTPUT"
    - name: "Cache local Maven repository"
      id: cache
      if: inputs.cache-mode == 'restore-save'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}
    - name: "Restore local Maven repository"
      id: restore
      if: inputs.cache-mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}
    # Only a total miss, not a fallback to an older entry, which is normal right after a pom.xml change.
    - name: "Warn when no Maven cache exists"
      if: inputs.cache-mode == 'restore' && steps.restore.outputs.cache-matched-key == ''
      shell: bash
      env:
        KEY_PREFIX: ${{ steps.key.outputs.prefix }}
      run: >
        echo "::warning title=No Maven cache::No cache entry starts with ${KEY_PREFIX}.
        Jobs using cache-mode restore never save, so one job in the workflow must use cache-mode restore-save."
    - name: "Install ${{ inputs.maven-settings }}"
      shell: bash
      env:
        MAVEN_SETTINGS: ${{ inputs.maven-settings }}
      run: ${{ github.action_path }}/install-settings.sh
    - name: "Set up Java"
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        overwrite-settings: false
