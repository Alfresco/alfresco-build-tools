name: 'Setup Flux CLI'
description: 'Set up a specific version of Flux CLI and add it to the PATH.'
inputs:
  version:
    description: 'Version of Flux CLI'
    required: false
    default: 2.9.3
runs:
  using: "composite"
  steps:
    - uses: Alfresco/alfresco-build-tools/.github/actions/setup-github-release-binary@d3678c78711c9b415728f1d77f6eede4971e9839
      with:
        binary_name: flux
        repo: fluxcd/flux2
        version: ${{ inputs.version }}
