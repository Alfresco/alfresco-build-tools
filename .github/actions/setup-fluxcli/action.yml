name: 'Setup Flux CLI'
description: 'Set up a specific version of Flux CLI and add it to the PATH.'
inputs:
  version:
    description: 'Version of Flux CLI'
    required: false
    default: 2.9.3
runs:
  using: "composite"
  steps:
    - uses: Alfresco/alfresco-build-tools/.github/actions/setup-github-release-binary@937051535f44e33859a17fef0abdcff4fae500ef
      with:
        binary_name: flux
        repo: fluxcd/flux2
        version: ${{ inputs.version }}
