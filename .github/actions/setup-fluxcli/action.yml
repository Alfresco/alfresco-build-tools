name: 'Setup Flux CLI'
description: 'Set up a specific version of Flux CLI and add it to the PATH.'
inputs:
  version:
    description: 'Version of Flux CLI'
    required: false
    default: 2.9.4
runs:
  using: "composite"
  steps:
    - uses: Alfresco/alfresco-build-tools/.github/actions/setup-github-release-binary@89bb2a9ef11b83490cce547e9cb894b5ffd6ae87
      with:
        binary_name: flux
        repo: fluxcd/flux2
        version: ${{ inputs.version }}
