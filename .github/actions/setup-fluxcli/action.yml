name: 'Setup Flux CLI'
description: 'Set up a specific version of Flux CLI and add it to the PATH.'
inputs:
  version:
    description: 'Version of Flux CLI'
    required: false
    default: 2.9.5
runs:
  using: "composite"
  steps:
    - uses: Alfresco/alfresco-build-tools/.github/actions/setup-github-release-binary@43b8a38fca3421f9bcb4757ee3d2adce4065dbf2
      with:
        binary_name: flux
        repo: fluxcd/flux2
        version: ${{ inputs.version }}
