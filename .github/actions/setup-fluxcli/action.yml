name: 'Setup Flux CLI'
description: 'Set up a specific version of Flux CLI and add it to the PATH.'
inputs:
  version:
    description: 'Version of Flux CLI'
    required: false
    default: 2.9.4
runs:
  using: "composite"
  steps:
    - uses: Alfresco/alfresco-build-tools/.github/actions/setup-github-release-binary@5a665d430cb3638745b7d1f66e5e25afcd6f61a4
      with:
        binary_name: flux
        repo: fluxcd/flux2
        version: ${{ inputs.version }}
