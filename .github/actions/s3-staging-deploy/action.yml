name: Deploy artifacts to S3 Staging Bucket
description: Optionally generates a third-party license CSV, then deploys a local directory of artifacts to an S3 staging bucket.

inputs:
  aws-access-key-id:
    description: AWS access key ID
    required: true
  aws-secret-access-key:
    description: AWS secret access key
    required: true
  aws-region:
    description: AWS region
    required: false
    default: eu-west-1
  deploy-dir:
    description: Local directory containing artifacts to upload
    required: false
    default: ./deploy_dir
  s3-bucket:
    description: S3 bucket name
    required: false
    default: alfresco-artefacts-staging
  s3-path:
    description: Path within the S3 bucket (without leading slash). When empty, artifacts are uploaded to the bucket root.
    required: false
    default: ''
  version:
    description: Artifact version, required when generate-license is 'true'
    required: false
    default: ''
  generate-license:
    description: Whether to generate a third-party license CSV using Alfresco/third-party-license-overrides
    required: false
    default: 'true'
  license-output-dir:
    description: Directory where the third-party license CSV will be written. Defaults to deploy-dir.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create deploy directory
      shell: bash
      env:
        DEPLOY_DIR: ${{ inputs.deploy-dir }}
      run: mkdir -p "${DEPLOY_DIR}"

    - name: Set up Python
      if: inputs.generate-license == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.x'

    - name: Generate third-party license CSV
      if: inputs.generate-license == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DEPLOY_DIR: ${{ inputs.deploy-dir }}
        LICENSE_OUTPUT_DIR: ${{ inputs.license-output-dir }}
      run: |
        git clone --depth=1 https://github.com/Alfresco/third-party-license-overrides.git
        output_dir="${LICENSE_OUTPUT_DIR:-$DEPLOY_DIR}"
        python3 ./third-party-license-overrides/thirdPartyLicenseCSVCreator.py \
          --project "${{ github.workspace }}" \
          --version "${VERSION}" \
          --combined \
          --output "${output_dir}"
        rm -rf third-party-license-overrides

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Deploy to S3 Staging Bucket
      shell: bash
      env:
        DEPLOY_DIR: ${{ inputs.deploy-dir }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_PATH: ${{ inputs.s3-path }}
      run: |
        if [ -n "${S3_PATH}" ]; then
          s3_destination="s3://${S3_BUCKET}/${S3_PATH}"
        else
          s3_destination="s3://${S3_BUCKET}"
        fi
        aws s3 cp --acl private --recursive "${DEPLOY_DIR}" "${s3_destination}"
