[tool.pytest.ini_options]
testpaths = ["unit"]
python_files = ["test_*.py"]
pythonpath = ["..", "../../../actions/pre-commit"]
markers = [
  "integration: integration tests (require external systems, may be slower)",
  "integration_pollution: integration tests with irreversible side effects",
]
addopts = '''
    -vvv
    -ra
    --tb=long
    --showlocals
    --strict-markers
    --import-mode=importlib
    --color=yes
    --random-order
    -o junit_family=xunit2
    -o junit_logging=all
    --junit-xml=report.xml
    --cov=pre_commit_frozen_revs
    --cov-report=term-missing
    --cov-report=xml
    -m "not integration and not integration_pollution"
'''
